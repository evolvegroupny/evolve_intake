<html lang="en">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Evolve Group — Intake Requirements</title>
<style>
:root{--navy:#063653;--blue:#087eae;--bg:#eaf2f7;--line:#b6cddd;--text:#071f3d;--muted:#25415b;--danger:#c62828}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:16px/1.5 Arial,Helvetica,sans-serif;color:var(--text)}
main{max-width:850px;margin:20px auto;padding:0 14px}.panel{background:white;border:1px solid #9fbdd0;border-radius:16px;box-shadow:0 10px 28px #0b35552b;overflow:hidden}
header{background:linear-gradient(115deg,#063653 0%,#00466b 72%,#087eae 100%);color:#fff;padding:20px 24px;display:flex;align-items:center;gap:22px;border-bottom:3px solid #1497c8;position:relative}header:after{content:"";position:absolute;right:0;top:0;bottom:0;width:20%;background:linear-gradient(125deg,transparent 0 38%,#1689b455 38% 60%,transparent 60% 68%,#1689b455 68% 88%,transparent 88%);pointer-events:none}header .logo-frame{display:flex;align-items:center;justify-content:flex-start;width:175px;max-width:35%;flex-shrink:0;background:transparent;border:0;border-radius:0;padding:0;position:relative;z-index:1}header .logo-svg{display:block;width:100%;height:auto;max-height:105px;filter:brightness(0) invert(1)}header .heading{min-width:0;position:relative;z-index:1}h1{font-size:26px;line-height:1.2;margin:0 0 8px;color:#fff}header p{margin:0;color:#e5f4ff;font-size:15px}
.content{padding:22px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:block;font-weight:700;margin-bottom:7px;color:#08294b;font-size:17px}
select{width:100%;padding:10px 12px;border:2px solid #9eb9cc;border-radius:9px;background:white;font:inherit;color:var(--text);min-height:50px}select:focus{outline:3px solid #28a4d333;border-color:#087eae}
.service-options{display:flex;flex-direction:column;gap:7px;padding:10px 12px;border:2px solid #9eb9cc;border-radius:9px;background:#fff;min-height:50px}
.check-option{display:flex;align-items:center;gap:9px;margin:0;font-size:15px;font-weight:400;color:var(--text);cursor:pointer}
.check-option[hidden]{display:none}.service-field[hidden]{display:none}.check-option input{width:17px;height:17px;accent-color:#087eae;margin:0;flex-shrink:0}
.result{margin-top:20px;padding:16px;border:2px solid #69b9dc;border-radius:12px;background:linear-gradient(120deg,#f2faff,#e0f2fb);min-height:100px}
.result h2{font-size:16px;text-transform:uppercase;letter-spacing:.07em;color:#075985;margin:0 0 10px;font-weight:800}
#answer{white-space:normal;font-size:16px}#answer ul{list-style:disc;margin:0;padding:0 0 0 22px}#answer li{padding:4px 0 4px 2px;border-bottom:1px solid #c7dfed}#answer li:last-child{border-bottom:0}#answer li::marker{color:#087eae}
.hint{color:#25415b;font-size:14px;margin-top:16px}#answer.not-applicable{color:var(--danger);font-weight:700;background:#fff4f4;border-left:4px solid var(--danger);padding:10px 12px;border-radius:5px}button{font:inherit}
@media(max-width:560px){.fields{grid-template-columns:1fr}.content{padding:18px}header{padding:18px;gap:14px;align-items:flex-start}header .logo-frame{width:100px;max-width:35%}header .logo-svg{max-height:75px}h1{font-size:21px}header p{font-size:13px}}
</style>

<div class="content">
<div class="fields">
<div><label for="project">Project Type</label><select id="project"><option value="">Select project type…</option></select></div>
<div class="service-field" id="serviceField" hidden><label>Service Needed</label><div id="services" class="service-options" role="group" aria-label="Service Needed">

<script>
const services = ["Layout", "Structure", "Seal", "As Built", "Consultation"];
const availableServices = {
  "New Construction": ["Layout", "Structure", "Seal", "Consultation"],
  "Addition": ["Layout", "Structure", "Seal", "As Built", "Consultation"],
  "Renovation": ["Layout", "Structure", "Seal", "As Built", "Consultation"],
  "Service Call": [],
  "Legalization": ["Seal", "As Built", "Consultation"],
  "Renderings": []
};
const data = {
  "New Construction": {
    "Layout": ["Survey", "Site Plans"],
    "Structure": ["Survey", "Site Plans", "Designer’s Plans"],
    "Seal": [], "Consultation": ["Survey", "Site Plans", "Designer’s Plans"]
  },
  "Renovation": {
    "Layout": ["Existing Plans", "Clear Images"],
    "Structure": ["Survey", "Existing Plans", "Clear Images", "Designer’s Plans"],
    "Seal": [], "As Built": ["Clear Images"],
    "Consultation": ["Existing Plans", "Clear Images", "Designer’s Plans", "Survey", "Site Plans"]
  },
  "Addition": {
    "Layout": ["Survey", "Site Plans", "Existing Plans", "Clear Images"],
    "Structure": ["Survey", "Site Plans", "Existing Plans", "Clear Images", "Designer’s Plans"],
    "Seal": [], "As Built": ["Clear Images"],
    "Consultation": ["Existing Plans", "Clear Images", "Designer’s Plans", "Survey", "Site Plans"]
  },
  "Service Call": {},
  "Legalization": {
    "Seal": ["Existing Plans", "Clear Images", "Inspector’s Comments"],
    "As Built": [],
    "Consultation": ["Existing Plans", "Clear Images", "Inspector’s Comments"]
  },
  "Renderings": {}
};
const projectSelect = document.getElementById('project');
const serviceField = document.getElementById('serviceField');
const serviceChecks = Array.from(document.querySelectorAll('#services input[type="checkbox"]'));
const answer = document.getElementById('answer');
const hint = document.getElementById('hint');
Object.keys(availableServices).forEach(project => {
  const option = document.createElement('option');
  option.value = project; option.textContent = project; projectSelect.appendChild(option);
});
function updateServices() {
  const project = projectSelect.value;
  const allowed = availableServices[project] || [];
  serviceChecks.forEach(check => {
    const wrapper = check.closest('.check-option');
    wrapper.hidden = !allowed.includes(check.value);
    if (wrapper.hidden) check.checked = false;
  });
  serviceField.hidden = !project || allowed.length === 0;
  updateResult();
}
function updateResult() {
  const project = projectSelect.value;
  const selectedServices = serviceChecks.filter(check => check.checked && !check.closest('.check-option').hidden).map(check => check.value);
  answer.classList.remove('not-applicable');
  if (!project) {
    answer.textContent = 'Select a Project Type to see what is needed.';
    hint.textContent = 'Choose a project type to begin.';
    return;
  }
  if (project === 'Service Call') {
    answer.textContent = 'Please describe the service needed in order description field.';
    hint.textContent = '';
    return;
  }
  if (project === 'Renderings') {
    renderItems(['Existing Plans', 'Clear Images', 'Design Inspiration Images']);
    hint.textContent = '';
    return;
  }
  if (selectedServices.length === 0) {
    answer.textContent = 'Select one or more services.';
    hint.textContent = 'Check every service needed. Requirements from selected services will be combined.';
    return;
  }
  const items = [];
  selectedServices.forEach(service => {
    (data[project][service] || []).forEach(item => { if (!items.includes(item)) items.push(item); });
  });
  if (selectedServices.includes('Layout') && selectedServices.includes('Structure')) {
    const idx = items.indexOf('Designer’s Plans');
    if (idx !== -1) items.splice(idx, 1);
  }
  const order = ['Survey', 'Site Plans', 'Existing Plans', 'Designer’s Plans', 'Clear Images', 'Inspector’s Comments', 'Design Inspiration Images'];
  items.sort((a, b) => order.indexOf(a) - order.indexOf(b));
  if (items.length === 0) {
    answer.classList.add('not-applicable');
    answer.textContent = 'Service needed is not applicable with Project Type.';
  } else {
    renderItems(items);
  }
  hint.textContent = 'Check every service needed. Requirements from selected services will be combined.';
}
function renderItems(items) {
  answer.classList.remove('not-applicable');
  const list = document.createElement('ul');
  items.forEach(item => { const li = document.createElement('li'); li.textContent = item; list.appendChild(li); });
  answer.replaceChildren(list);
}
projectSelect.addEventListener('change', updateServices);
serviceChecks.forEach(check => check.addEventListener('change', updateResult));
</script>
